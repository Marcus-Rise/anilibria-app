name: Build TV test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew :app-tv:assembleAppDebug
      - uses: actions/upload-artifact@v7
        with:
          name: tv-auth-test-apk
          path: app-tv/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
