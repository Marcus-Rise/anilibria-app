name: Build Android TV APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'TV application name (empty keeps the original)'
        required: false
        type: string
      apk_name:
        description: 'APK filename (empty keeps the project default)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: ${{ inputs.app_name || '' }}
      APK_NAME: ${{ inputs.apk_name || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Create disposable signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -alias aniliberty-tv -keyalg RSA -keysize 2048 -validity 1 -storepass test-password -keypass test-password -dname "CN=Disposable CI test"
          echo "TEST_KEYSTORE=$(base64 -w 0 "$RUNNER_TEMP/test.jks")" >> "$GITHUB_ENV"
      - name: Configure optional signing
        env:
          KEYSTORE: ${{ env.TEST_KEYSTORE }}
          PASSWORD: test-password
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ -z "$KEYSTORE" ] && [ -z "$PASSWORD" ]; then
            echo "::warning::No signing key configured; APK will be unsigned."
          else
            echo "::error::Both signing secrets are required."
            exit 1
          fi
      - name: Build TV release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: test-password
        run: ./gradlew :app-tv:copyAppReleaseApk
      - name: Verify test signature
        run: "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose release-apks/*.apk
      - uses: actions/upload-artifact@v7
        with:
          name: disposable-signature-test
          path: release-apks/*.apk
          if-no-files-found: error
